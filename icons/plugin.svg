<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5a52"/>
      <stop offset="1" stop-color="#0a2d2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#5fc9b8" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#5fc9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5fcfa" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#c9e6df" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="renew" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="0.5" stop-color="#ffc266"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>

  <!-- Base rounded-square -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- Subtle horizontal strata (layered city / geological feel) -->
  <g stroke="#a0e3d4" stroke-opacity="0.07" stroke-width="1.5">
    <path d="M48 384H464"/>
    <path d="M48 352H464"/>
    <path d="M48 320H464"/>
    <path d="M48 288H464"/>
    <path d="M48 256H464"/>
    <path d="M48 224H464"/>
    <path d="M48 192H464"/>
    <path d="M48 160H464"/>
  </g>

  <!-- Ground line: solid horizon -->
  <path d="M48 400H464" stroke="#7fd6c4" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

  <!-- LAYERED CITY SKYLINE — stratified blocks of varying heights -->
  <!-- Block 1 (leftmost, low) -->
  <rect x="80" y="296" width="56" height="104" rx="4" fill="url(#skyline)" stroke="#0a2d2a" stroke-width="4"/>
  <!-- Horizontal floor bands -->
  <g stroke="#0a2d2a" stroke-opacity="0.5" stroke-width="2">
    <path d="M80 320H136"/>
    <path d="M80 344H136"/>
    <path d="M80 368H136"/>
  </g>

  <!-- Block 2 (taller) -->
  <rect x="148" y="232" width="64" height="168" rx="4" fill="url(#skyline)" stroke="#0a2d2a" stroke-width="4"/>
  <g stroke="#0a2d2a" stroke-opacity="0.5" stroke-width="2">
    <path d="M148 264H212"/>
    <path d="M148 296H212"/>
    <path d="M148 328H212"/>
    <path d="M148 360H212"/>
  </g>
  <!-- Roof accent on tallest -->
  <path d="M156 232L180 200L204 232" fill="none" stroke="#0a2d2a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Block 3 (mid) -->
  <rect x="224" y="264" width="56" height="136" rx="4" fill="url(#skyline)" stroke="#0a2d2a" stroke-width="4"/>
  <g stroke="#0a2d2a" stroke-opacity="0.5" stroke-width="2">
    <path d="M224 296H280"/>
    <path d="M224 328H280"/>
    <path d="M224 360H280"/>
  </g>

  <!-- Block 4 (lower, wider) -->
  <rect x="292" y="312" width="72" height="88" rx="4" fill="url(#skyline)" stroke="#0a2d2a" stroke-width="4"/>
  <g stroke="#0a2d2a" stroke-opacity="0.5" stroke-width="2">
    <path d="M292 340H364"/>
    <path d="M292 368H364"/>
  </g>

  <!-- Block 5 (rightmost, mid-tall) -->
  <rect x="376" y="248" width="56" height="152" rx="4" fill="url(#skyline)" stroke="#0a2d2a" stroke-width="4"/>
  <g stroke="#0a2d2a" stroke-opacity="0.5" stroke-width="2">
    <path d="M376 280H432"/>
    <path d="M376 312H432"/>
    <path d="M376 344H432"/>
    <path d="M376 376H432"/>
  </g>

  <!-- RENEWAL CURVE — large sweeping arc above the skyline -->
  <!-- Main resilience/recovery arc: curves up from one side and down the other -->
  <path d="M 64 224 Q 256 64 448 224"
        fill="none" stroke="url(#renew)" stroke-width="14"
        stroke-linecap="round"/>

  <!-- Cycle pulse dots on the curve at evenly spaced waypoints -->
  <circle cx="64" cy="224" r="14" fill="#ff8a3d" stroke="#0a2d2a" stroke-width="3"/>
  <circle cx="160" cy="136" r="9" fill="#ffc266" stroke="#0a2d2a" stroke-width="2"/>
  <circle cx="256" cy="110" r="11" fill="#ffd57a" stroke="#0a2d2a" stroke-width="2"/>
  <circle cx="352" cy="136" r="9" fill="#ffc266" stroke="#0a2d2a" stroke-width="2"/>
  <circle cx="448" cy="224" r="14" fill="#ff8a3d" stroke="#0a2d2a" stroke-width="3"/>

  <!-- Small "downward" continuation arcs hinting at cyclic recovery -->
  <path d="M 64 224 Q 36 280 56 336" fill="none" stroke="#ff8a3d" stroke-opacity="0.5"
        stroke-width="5" stroke-linecap="round" stroke-dasharray="3 8"/>
  <path d="M 448 224 Q 476 280 456 336" fill="none" stroke="#ff8a3d" stroke-opacity="0.5"
        stroke-width="5" stroke-linecap="round" stroke-dasharray="3 8"/>
</svg>
